name: user-statistician

on:
  schedule:
    - cron: '0 3 * * *'   # Runs daily at 3:00 AM UTC
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate the user stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          colors: dark
          custom-title: 'Sankalp Satpute — GitHub Statistics'
          animated-language-chart: true
          language-animation-speed: 10
          category-order: general, repositories, contributions, languages
          border-radius: 6
          locale: en
          commit-and-push: true
          commit-message: 'Automated stats update by cicirello/user-statistician'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
